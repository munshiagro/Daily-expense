   if(cash)await cashAdd(v.amt+pf,0,d,'বিনিয়োগ ফেরত ও রিটার্ন','বিনিয়োগ');await log('রিটার্ন বণ্টন ৳'+pf);await summ();close();toast('রিটার্ন সবার সঞ্চয়ে যোগ হয়েছে');render()}catch(e){q('#y').disabled=false;toast('সংরক্ষণ হয়নি','er')}}}
</script></body></html>
